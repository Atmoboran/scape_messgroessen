<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messgrößen der Wetterstation</title>
<meta name="description" content="">
<!-- Structure only. Design: theme/ · texts: content/texts.de.js · layout: css/ · behaviour: js/ -->
<script src="js/view.js" data-app="messgroessen"></script>
<link rel="stylesheet" href="theme/theme.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <a class="logo" href="#start" data-brand="logo"></a>
  <div class="top-right">
    <nav class="nav" data-t-aria="nav.aria">
      <a href="#start" data-route="start" data-t="nav.display"></a>
      <a href="#warum" data-route="warum" data-t="nav.why"></a>
    </nav>
    <button type="button" class="view-toggle"></button>
  </div>
</header>

<main>
  <!-- ================= Start: the display of the station ================= -->
  <section class="view-page" id="page-start" hidden>
    <div class="poster" data-poster="start">
      <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
      <svg class="l2" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <svg class="l3" viewBox="0 0 400 400" aria-hidden="true"></svg>
      <div class="poster-text">
        <p class="kicker" data-t="start.kicker"></p>
        <h1 class="headline" data-t-html="start.headline"></h1>
        <p class="lead" data-t="start.lead"></p>
      </div>
    </div>
    <div class="page">
      <div class="display-head">
        <h2 class="section-label" data-t="start.displayTitle"></h2>
        <p data-t="start.displayNote"></p>
      </div>
      <div class="display" id="display" role="group" data-t-aria="start.displayAria"></div>
    </div>
  </section>

  <!-- ================= Warum messen? ================= -->
  <section class="view-page" id="page-warum" hidden>
    <div class="poster" data-poster="warum">
      <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
      <svg class="l2" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <svg class="l3" viewBox="0 0 400 400" aria-hidden="true"></svg>
      <div class="poster-text">
        <p class="kicker" data-t="why.kicker"></p>
        <h1 class="headline" data-t="why.headline"></h1>
        <p class="lead" data-t="why.lead"></p>
      </div>
    </div>
    <div class="why">
      <div><h2 class="n" data-t="why.t1"></h2><p data-t="why.p1"></p></div>
      <div><h2 class="n" data-t="why.t2"></h2><p data-t="why.p2"></p></div>
      <div><h2 class="n" data-t="why.t3"></h2><p data-t="why.p3"></p></div>
    </div>
    <div class="page">
      <p class="next-part"><a class="btn" href="#start" data-t="why.toDisplay"></a></p>
    </div>
  </section>

  <!-- ================= One quantity ================= -->
  <section class="view-page" id="page-detail" hidden>
    <div class="poster small" id="dPoster">
      <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
      <svg class="l2" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <svg class="l3" viewBox="0 0 400 400" aria-hidden="true"></svg>
      <div class="poster-text">
        <p class="kicker" id="dKicker"></p>
        <h1 class="headline" id="dHead"></h1>
        <p class="lead" id="dLead"></p>
      </div>
    </div>
    <nav class="strip" id="strip" data-t-aria="detail.stripAria"></nav>
    <div class="page">
      <div class="lab">
        <div class="lab-stage">
          <!-- the simulation puts its canvas in here -->
          <div class="stage-frame square fit" id="simFrame"></div>
        </div>
        <div class="lab-post">
          <div id="simCtrl"></div>
          <div class="tasks" id="mg-tasks" hidden>
            <details id="tasksDrop">
              <summary><span data-t="kit.tasks"></span><span class="count"></span></summary>
              <ul></ul>
            </details>
          </div>
          <div class="merke" data-for="mg-tasks">
            <h3 data-t="kit.merke"></h3>
            <p id="dMerke"></p>
            <span class="locked-note"></span>
          </div>
        </div>
      </div>

      <div class="topics">
        <details class="topic" id="topic-messung"><summary data-t="detail.topics.messung"></summary><div class="topic-body"><p></p></div></details>
        <details class="topic" id="topic-einordnung"><summary data-t="detail.topics.einordnung"></summary><div class="topic-body"><p></p></div></details>
        <details class="topic" id="topic-hinweis"><summary data-t="detail.topics.hinweis"></summary><div class="topic-body"><p></p></div></details>
        <details class="topic" id="topic-model"><summary data-t="detail.topics.model"></summary><div class="topic-body"><p></p></div></details>
      </div>

      <div class="pager">
        <a class="btn prev" id="dPrev" href="#"><span aria-hidden="true">←</span><span class="t"></span></a>
        <a class="btn home" href="#start" data-t="detail.home"></a>
        <a class="btn next" id="dNext" href="#"><span class="t"></span><span aria-hidden="true">→</span></a>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <p class="sources" data-t="foot.sources"></p>
  <p class="brand-line" data-brand="line"></p>
</footer>

<script src="theme/theme.js"></script>
<script src="content/texts.de.js"></script>
<script src="js/texts.js"></script>
<script src="js/brand.js"></script>
<script src="js/kit.js"></script>
<script src="js/data.js"></script>
<script src="js/sim-kit.js"></script>
<script src="js/sims/temperatur.js"></script>
<script src="js/sims/feuchte.js"></script>
<script src="js/sims/druck.js"></script>
<script src="js/sims/regen.js"></script>
<script src="js/sims/wind.js"></script>
<script src="js/sims/koerper.js"></script>
<script src="js/sims/uv.js"></script>
<script src="js/sims/licht.js"></script>
<script src="js/sims/mond.js"></script>
<script src="js/sims/sonne.js"></script>
<script src="js/app.js"></script>
</body>
</html>
